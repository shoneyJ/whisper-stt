[project]
name = "whisper-stt-worker"
version = "0.1.0"
description = "faster-whisper inference worker for whisper-stt"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["whisper_worker.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
