[package]
name = "whisperd"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "whisper-stt daemon: audio capture, worker lifecycle, IPC, indicator, injector"

[[bin]]
name = "whisperd"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
whisper-stt-proto = { workspace = true }
base64 = "0.22"
hound = "3"

# Optional — only pulled when `--features gui` is set, which also requires
# libgtk-4-dev on the build host.
gtk4 = { version = "0.9", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[features]
default = []
gui = ["dep:gtk4"]
